# XcodeGen spec for the travel demo:
#   cd Examples/TravelDemo && xcodegen generate && open TravelDemo.xcodeproj
name: TravelDemo
options:
  bundleIdPrefix: dev.swifta2uihost
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftA2UIHost:
    path: ../..
targets:
  TravelDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftA2UIHost
        product: SwiftA2UIHostUI
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swifta2uihost.traveldemo
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
